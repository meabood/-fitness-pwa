<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <!-- Strict CSP (Part 1). connect-src 'none' => no network I/O for app data.
       No external scripts/styles/fonts. Adjust only if technically required. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self';
    img-src 'self' data:;
    font-src 'self';
    connect-src 'none';
    media-src 'none';
    object-src 'none';
    frame-src 'none';
    base-uri 'none';
    form-action 'self';
    manifest-src 'self';
    worker-src 'self';
  " />

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbfbfd" />
  <meta name="color-scheme" content="light" />

  <title>LOCKD</title>

  <!-- iOS standalone (add-to-home-screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="LOCKD" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />

  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/components.css" />
</head>
<body>
  <div id="app"><!-- app shell mounts here --></div>
  <noscript>يتطلّب هذا التطبيق تفعيل JavaScript.</noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
